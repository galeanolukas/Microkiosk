{% args titulo, appname, modo, tema %}
<!DOCTYPE html>
<html>
{% include 'head.html' %}
<body class="{{ tema }}-theme">
  {% include 'top_bar.html' %}

  <main class="w3-container w3-center" style="max-width:600px;margin:auto;padding-top:32px;">
    <div class="w3-card w3-padding-32">
      <div class="w3-margin-bottom">
        <span class="icon icon-warning icon-xxlarge icon-red"></span>
      </div>

      <h2 class="w3-text-red">Reiniciar Dispositivo</h2>
      <p class="w3-large w3-margin-bottom">¿Está seguro que desea reiniciar el dispositivo?</p>
      <p class="w3-small w3-text-grey">La conexión se perderá temporalmente durante el proceso</p>

      <form method="POST" action="/reiniciar" class="w3-margin-top">
        <button class="{{ tema }}-theme w3-button w3-round-xlarge w3-padding-large w3-xlarge w3-hover-red"
                type="submit"
                style="min-width:200px;">
          <span class="icon icon-reload"></span> CONFIRMAR REINICIO
        </button>
      </form>
    </div>
  </main>

  {% include 'footer.html' %}

  <script>
  // Prevenir envíos múltiples del formulario
  document.querySelector('form').addEventListener('submit', function(e) {
    const btn = this.querySelector('button[type="submit"]');
    btn.disabled = true;
    btn.innerHTML = '<span class="icon icon-spinner w3-spin"></span> REINICIANDO...';
  });
  </script>
</body>
</html>
