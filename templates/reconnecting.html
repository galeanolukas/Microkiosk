<!DOCTYPE html>
<html>
<head>
    <title>Reconectando...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/w3.css">
</head>
<body class="w3-container">
    <div class="w3-panel w3-yellow w3-display-container" style="height:100vh">
        <div class="w3-display-middle">
            <h2><i class="w3-xxlarge">🔄</i> Reconectando...</h2>
            <p>El cliente perdió conexión con el servidor.</p>
            <p>Serás redirigido automáticamente cuando se restablezca la conexión.</p>
            <button onclick="window.location.reload()" class="w3-button w3-blue">Reintentar ahora</button>
        </div>
    </div>
    <script>
        function checkReconnect() {
            fetch('/connection-status')
                .then(response => {
                    if(response.ok) {
                        window.location.reload();
                    } else {
                        setTimeout(checkReconnect, 2000);
                    }
                })
                .catch(() => setTimeout(checkReconnect, 2000));
        }
        
        // Comenzar a verificar
        setTimeout(checkReconnect, 2000);
    </script>
</body>
</html>
