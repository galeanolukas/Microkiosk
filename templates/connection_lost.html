<!DOCTYPE html>
<html>
<head>
    <title>Conexión Perdida</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/w3.css">
</head>
<body class="w3-container">
    <div class="w3-panel w3-red w3-display-container" style="height:100vh">
        <div class="w3-display-middle">
            <h2><i class="w3-xxlarge">⚠️</i> Conexión Perdida</h2>
            <p>El dispositivo perdió conexión a la red.</p>
            <p>Intentando reconectar automáticamente...</p>
            <div class="w3-light-grey w3-round">
                <div id="progress" class="w3-blue w3-round" style="height:24px;width:0%"></div>
            </div>
            <p id="countdown">Reintentando en 10 segundos</p>
        </div>
    </div>
    <script>
        let timeLeft = 10;
        const countdown = setInterval(() => {
            timeLeft--;
            document.getElementById('countdown').textContent = `Reintentando en ${timeLeft} segundos`;
            document.getElementById('progress').style.width = `${(10-timeLeft)*10}%`;
            
            if(timeLeft <= 0) {
                clearInterval(countdown);
                checkConnection();
            }
        }, 1000);
        
        function checkConnection() {
            fetch('/connection-status')
                .then(response => response.json())
                .then(data => {
                    if(data.connected) {
                        window.location.reload();
                    } else {
                        timeLeft = 10;
                        document.getElementById('countdown').textContent = `Reintentando en ${timeLeft} segundos`;
                        document.getElementById('progress').style.width = `0%`;
                        setTimeout(checkConnection, 10000);
                    }
                });
        }
    </script>
</body>
</html>
