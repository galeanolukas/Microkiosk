<!--Menu Panel -->
<div id="AppsPanel" class="w3-hide w3-animate-top">
  <div class="w3-row-padding w3-center w3-margin-top">
    {% for app in apps.values() %}
    <!-- Cada tarjeta ocupa 12 columnas en móvil (100%), 4 en desktop (33.33%) -->
    <div class="w3-third">
      <div class="w3-card w3-container w3-padding" style="min-height:150px;">
        <!-- Botón favorito -->
        <button class="w3-button w3-round w3-display-topright" onclick="toggleFavorite('{{ app['name'] }}')">
          <span class="icon icon-heart {% if app['fav'] == 'True' %}icon-red{% else %}icon-gray{% endif %}">
          </span>
        </button>
        <a href="{{ app['url'] }}" style="text-decoration: none;">
        {% if app["icon"] %}
              <img src="{{ app['icon'] }}" alt="{{ app['name'] }}" style="width:30%">
        {% else %}
              <span class="icon icon-apps" style="width:30%;"></span>
        {% endif %}
        </a>
        <h5>{{ app['name'] }}</h5>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
