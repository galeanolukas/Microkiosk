{% args appname, modo %}
<!DOCTYPE html>
<html>
<head>
    <title>Control LED RGB</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/w3pro.css">
    <script src="/static/rgb_control.js">
</head>
<body class="w3-container">
    <h2 class="w3-center">Control LED RGB</h2>

    <div class="w3-card-4 w3-margin-bottom">
        <header class="w3-container w3-blue">
            <h3>Ajuste Manual</h3>
        </header>

        <div class="w3-padding">
            <div id="colorPreview" class="w3-border w3-margin-bottom" style="height:100px"></div>

            <div class="w3-margin-bottom">
                <label>Rojo: <span id="rValue">0</span></label>
                <input type="range" min="0" max="255" value="0"
                       class="w3-input w3-blue" id="rSlider">
            </div>

            <div class="w3-margin-bottom">
                <label>Verde: <span id="gValue">0</span></label>
                <input type="range" min="0" max="255" value="0"
                       class="w3-input w3-green" id="gSlider">
            </div>

            <div class="w3-margin-bottom">
                <label>Azul: <span id="bValue">0</span></label>
                <input type="range" min="0" max="255" value="0"
                       class="w3-input w3-indigo" id="bSlider">
            </div>

            <button class="w3-button w3-black w3-block" onclick="updateColor()">Aplicar</button>
        </div>
    </div>

    <div class="w3-card-4">
        <header class="w3-container w3-blue">
            <h3>Presets Rápidos</h3>
        </header>

        <div class="w3-padding w3-center">
            <button class="w3-button w3-red" onclick="setPreset('red')">Rojo</button>
            <button class="w3-button w3-green" onclick="setPreset('green')">Verde</button>
            <button class="w3-button w3-blue" onclick="setPreset('blue')">Azul</button>
            <button class="w3-button w3-yellow" onclick="setPreset('yellow')">Amarillo</button>
            <button class="w3-button w3-purple" onclick="setPreset('purple')">Morado</button>
            <button class="w3-button w3-white w3-border" onclick="setPreset('white')">Blanco</button>
            <button class="w3-button w3-black" onclick="setPreset('off')">Apagar</button>
        </div>
    </div>
</body>
</html>
